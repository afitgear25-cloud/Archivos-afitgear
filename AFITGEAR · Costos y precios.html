 eS(id){const s=S.sup.find(x=>x.id==id)||{name:'',env:0,note:''};mod(id?'Editar proveedor':'Nuevo proveedor',`<label>Nombre</label><input id="sn" value="${esc(s.name)}"><label>Recargo por envío (% sobre el costo)</label><input id="se" type="number" step="0.5" value="${s.env}"><div class="pv">Calculadora: envío por pedido <input id="c1" type="number" placeholder="17000" style="width:110px"> ÷ pedido típico en costo <input id="c2" type="number" placeholder="170000" style="width:120px"> = <b id="c3">—</b></div><label>Notas</label><textarea id="sx" rows="3">${esc(s.note)}</textarea>`,['sS',id||'']);if(id)$('#md .ft').insertAdjacentHTML('afterbegin',`<button class="b d" data-a="dS" data-i="${id}">Eliminar</button>`)},
 sS(id){const n=V('sn').trim();if(!n)return toast('Falta el nombre');const o={id:id||uid(),name:n,env:num(V('se')),note:V('sx')},k=S.sup.findIndex(x=>x.id==id);k<0?S.sup.push(o):S.sup[k]=o;A.cm();save();render()},
 dS(id){if(S.prods.some(p=>p.sup==id))return toast('Primero mové sus productos a otro proveedor');if(confirm('¿Eliminar proveedor?')){S.sup=S.sup.filter(x=>x.id!=id);A.cm();save();render()}},
 aC(){const n=V('nc').trim();if(n){S.cats.push({id:uid(),name:n});save();render()}},
 eC(id){const n=prompt('Nuevo nombre de la categoría',ct(id).name);if(n&&n.trim()){ct(id).name=n.trim();save();render()}if(n===''&&!S.prods.some(p=>p.cat==id)&&confirm('¿Eliminar categoría vacía?')){S.cats=S.cats.filter(c=>c.id!=id);save();render()}},
 mC(id,t){const i=S.cats.findIndex(c=>c.id==id),j=i+ +t.dataset.d;if(j<0||j>=S.cats.length)return;[S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]];save();render()},
 kt(i){ui.t[i]=ui.t[i]?0:1;render()},
 pdf(){if(!window.jspdf||!window.jspdf.jsPDF)return toast('No se pudo cargar el generador de PDF');const d=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),W=d.internal.pageSize.getWidth(),H=d.internal.pageSize.getHeight(),ts=[0,1,2].filter(i=>ui.t[i]);if(!ts.length)return toast('Elegí al menos un precio');
  d.setFillColor(47,109,246);d.rect(0,0,W,72,'F');d.setTextColor(255,255,255);d.setFont('helvetica','bold');d.setFontSize(24);d.text('AFITGEAR',40,40);d.setFont('helvetica','normal');d.setFontSize(11);d.text(ui.ct||'Lista de precios',40,59);d.text(new Date().toLocaleDateString('es-AR'),W-40,59,{align:'right'});
  const body=kRows().map(r=>r.h?[{content:r.h,colSpan:1+ts.length,styles:{fontStyle:'bold',fillColor:[232,238,254],textColor:[47,109,246]}}]:[r.n,...ts.map(i=>$$(r.v[i]))]);
  d.autoTable({startY:92,head:[['Producto',...ts.map(i=>TN[i])]],body,theme:'grid',styles:{fontSize:9.5,cellPadding:4,lineColor:[225,229,238]},headStyles:{fillColor:[47,109,246],textColor:255},columnStyles:Object.fromEntries(ts.map((i,k)=>[k+1,{halign:'right',cellWidth:90}])),margin:{left:40,right:40,bottom:48},didDrawPage:h=>{d.setFontSize(8);d.setTextColor(120,120,120);d.text('Pedidos por encargo (preparación: 1 semana) · Entrega en estaciones de Monte Grande · Envíos a domicilio con costo adicional · Pago en efectivo o transferencia',40,H-30,{maxWidth:W-80});d.text('Página '+h.pageNumber,W-40,H-14,{align:'right'})}});
  const nm='AFITGEAR-catalogo'+(ui.ct?'-'+ui.ct.replace(/[^\w ]+/g,'').trim().replace(/\s+/g,'-'):'')+'-'+new Date().toISOString().slice(0,10)+'.pdf';dl(nm,d.output('arraybuffer'))},
 wa(){const tx=(ui.ct?ui.ct+'\n\n':'')+kRows().map(r=>r.h?`\n*${r.h}*`:`${r.n}: `+r.v.map((x,i)=>ui.t[i]?(ui.t.filter(Boolean).length>1?TN[i]+' ':'')+$$(x):null).filter(Boolean).join(' | ')).join('\n');
  navigator.clipboard.writeText(tx).then(()=>toast('Copiado')).catch(()=>mod('Copiá el texto',`<textarea rows="12" style="width:100%">${esc(tx)}</textarea>`))},
 kc(){const h=['Categoría','Producto',...TN.filter((t,i)=>ui.t[i])];dl('catalogo.csv',csv([h,...kRows().filter(r=>!r.h).map(r=>[cByP(r.n),r.n,...r.v.filter((x,i)=>ui.t[i])])]))},
 xa(){dl('afitgear-costos.csv',csv([['Categoría','Producto','Proveedor','Costo','Costo con envío',...TN.flatMap(t=>['Precio '+t,'Ganancia '+t,'Margen % '+t])],...ordP().map(p=>{const c=calc(p);return[ct(p.cat).name,p.name,sp(p.sup).name,p.cost,Math.round(c.land),...c.t.flatMap(t=>[t.pr,Math.round(t.g),Math.round(t.mg)])]})]))},
 xj(){dl('afitgear-respaldo.json',JSON.stringify(S))},ij(){$('#fj').click()},
 rs(){if(confirm('Se pierden todos los cambios y vuelven los datos iniciales. ¿Seguro?')){S=JSON.parse(JSON.stringify(SEED));save();render()}}};
const cByP=n=>{const p=S.prods.find(x=>x.name==n);return p?ct(p.cat).name:''};
const csv=r=>'\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
async function dl(f,d){try{const u=await window.claude?.use('downloads');if(!u)throw 0;await u.save({filename:f,data:d})}catch(e){if(e&&e.code=='declined')return;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d]));a.download=f;a.click()}catch(x){toast('No se pudo descargar')}}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a]){e.stopPropagation();A[t.dataset.a](t.dataset.i,t)}});
document.addEventListener('input',e=>{const id=e.target.id;
 if(id=='q'){ui.q=e.target.value;tP()}else if(id=='kt'){ui.ct=e.target.value;$('#ch').textContent=ui.ct||'AFITGEAR · Lista de precios'}
 else if(id=='mn'){S.cfg.min=num(e.target.value);save()}
 else if($('#md')&&/^(fo|fm|fx|fl2|fp)/.test(id))pvw();
 else if(id=='c1'||id=='c2'){const r=num(V('c1'))/num(V('c2'))*100;$('#c3').textContent=isFinite(r)&&r?r.toFixed(1)+'%':'—';if(isFinite(r)&&r)$('#se').value=r.toFixed(1)}});
document.addEventListener('change',e=>{const id=e.target.id;
 if(id=='fc'){ui.cat=e.target.value;tP()}else if(id=='fs'){ui.sup=e.target.value;tP()}else if(id=='fl'){ui.low=e.target.checked;tP()}
 else if(id=='kc'){ui.cc=e.target.value;render()}else if(id=='ep'){S.cfg.envP=e.target.checked;save()}
 else if(id=='fp'&&$('#md'))pvw();
 else if(id=='fj'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.prods)throw 0;S=d;save();render();toast('Respaldo restaurado')}catch(x){toast('Archivo no válido')}};r.readAsText(f)}});
render();
(async()=>{try{const c=await window.claude?.use('db');if(!c)return;DB=c;const ref=c.doc('afitgear/state'),r=await ref.get();
 if(r.exists){S=JSON.parse(r.data().s);if(!$('#md'))render()}ui.sy='☁ Sincronizado';stat();
 ref.onSnapshot(sn=>{if(sn.metadata.hasPendingWrites||!sn.exists||$('#md'))return;try{S=JSON.parse(sn.data().s);if(ui.tab!='p'||document.activeElement.id!='q')render()}catch(e){}})}catch(e){}})();
</script></body></html>
